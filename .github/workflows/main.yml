name: Build Farmo Earn APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/farmo/earn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Farmo Earn"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.farmo.earn'
              compileSdk 34

              defaultConfig {
                  applicationId "com.farmo.earn"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # app/src/main/res/values/strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Farmo Earn</string>
          </resources>
          EOF

          # app/src/main/res/xml/accessibility_service_config.xml
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:notificationTimeout="100"
              android:packageNames="com.google.android.youtube" />
          EOF

          # app/src/main/res/layout/activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/mainWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # app/src/main/res/layout/overlay_countdown.xml
          cat << 'EOF' > app/src/main/res/layout/overlay_countdown.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#DD12072B"
              android:padding="10dp"
              android:orientation="horizontal"
              android:gravity="center">
              <TextView
                  android:id="@+id/overlayTimer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Farmo: 15s"
                  android:textColor="#10b981"
                  android:textSize="14sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".YouTubeWatcherService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # app/src/main/java/com/farmo/earn/MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/farmo/earn/MainActivity.kt
          package com.farmo.earn

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  webView = findViewById(R.id.mainWebView)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.addJavascriptInterface(WebAppInterface(this), "AndroidBridge")

                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("http://zaicash.gamer.gd/index.php?app=1")
              }

              override fun onResume() {
                  super.onResume()
                  checkAllPermissions()
              }

              fun checkAllPermissions() {
                  val p1 = isAccessibilityServiceEnabled(this, YouTubeWatcherService::class.java)
                  val p2 = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.canDrawOverlays(this) else true
                  val p3 = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.System.canWrite(this) else true
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  val p4 = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) pm.isIgnoringBatteryOptimizations(packageName) else true

                  val t1 = if (p1) "Granted" else "Grant"
                  val t2 = if (p2) "Granted" else "Grant"
                  val t3 = if (p3) "Granted" else "Grant"
                  val t4 = if (p4) "Granted" else "Grant"

                  val js = "javascript:(function(){" +
                          "if(window.grantedPerms){" +
                          "  grantedPerms[1] = " + p1 + "; var b1 = document.getElementById('p-btn-1'); if(b1) b1.innerText = '" + t1 + "';" +
                          "  grantedPerms[2] = " + p2 + "; var b2 = document.getElementById('p-btn-2'); if(b2) b2.innerText = '" + t2 + "';" +
                          "  grantedPerms[3] = " + p3 + "; var b3 = document.getElementById('p-btn-3'); if(b3) b3.innerText = '" + t3 + "';" +
                          "  grantedPerms[4] = " + p4 + "; var b4 = document.getElementById('p-btn-4'); if(b4) b4.innerText = '" + t4 + "';" +
                          "  if(" + p1 + " && " + p2 + " && " + p3 + " && " + p4 + "){" +
                          "    var b = document.getElementById('btn-perm-confirm'); if(b){ b.disabled = false; b.className = 'w-full py-4 rounded-xl purple-gradient text-white font-black text-xs uppercase cursor-pointer'; }" +
                          "  }" +
                          "}" +
                          "})()"
                  webView.post { webView.evaluateJavascript(js, null) }
              }

              private fun isAccessibilityServiceEnabled(context: Context, service: Class<*>): Boolean {
                  val expectedComponentName = "${context.packageName}/${service.name}"
                  val enabledServicesSetting = Settings.Secure.getString(
                      context.contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServicesSetting.contains(expectedComponentName)
              }

              inner class WebAppInterface(private val context: Context) {
                  @JavascriptInterface
                  fun requestPerm(step: Int) {
                      when (step) {
                          1 -> startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          2 -> if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          3 -> if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName")))
                          4 -> if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
                      }
                  }

                  @JavascriptInterface
                  fun launchYouTube(videoId: String) {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:$videoId"))
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try {
                          startActivity(intent)
                          YouTubeWatcherService.startWatchCountdown(context, videoId)
                      } catch (e: Exception) {
                          val webIntent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/watch?v=$videoId"))
                          webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(webIntent)
                      }
                  }
              }
          }
          EOF

          # app/src/main/java/com/farmo/earn/YouTubeWatcherService.kt
          cat << 'EOF' > app/src/main/java/com/farmo/earn/YouTubeWatcherService.kt
          package com.farmo.earn

          import android.accessibilityservice.AccessibilityService
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.net.Uri
          import android.os.Build
          import android.os.CountDownTimer
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import okhttp3.*
          import java.io.IOException

          class YouTubeWatcherService : AccessibilityService() {

              private var windowManager: WindowManager? = null
              private var overlayView: View? = null
              private var timerText: TextView? = null
              private var countDownTimer: CountDownTimer? = null

              companion object {
                  var activeVideoId: String = ""
                  fun startWatchCountdown(context: Context, videoId: String) {
                      activeVideoId = videoId
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  setupFloatingOverlay()
              }

              @SuppressLint("InflateParams")
              private fun setupFloatingOverlay() {
                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.END
                  params.x = 30
                  params.y = 120

                  overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_countdown, null)
                  timerText = overlayView?.findViewById(R.id.overlayTimer)
                  overlayView?.visibility = View.GONE

                  try {
                      windowManager?.addView(overlayView, params)
                  } catch (e: Exception) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return

                  if (pkg == "com.google.android.youtube") {
                      if (overlayView?.visibility != View.VISIBLE) {
                          overlayView?.visibility = View.VISIBLE
                          run15SecTimer()
                      }
                  } else {
                      overlayView?.visibility = View.GONE
                      countDownTimer?.cancel()
                  }
              }

              private fun run15SecTimer() {
                  countDownTimer?.cancel()
                  countDownTimer = object : CountDownTimer(15000, 1000) {
                      override fun onTick(millisUntilFinished: Long) {
                          timerText?.text = "Farmo: " + (millisUntilFinished / 1000) + "s"
                      }

                      override fun onFinish() {
                          timerText?.text = "Earned!"
                          claimRewardOnServer()
                      }
                  }.start()
              }

              private fun claimRewardOnServer() {
                  val client = OkHttpClient()
                  val formBody = FormBody.Builder()
                      .add("task_id", "0")
                      .build()

                  val request = Request.Builder()
                      .url("http://zaicash.gamer.gd/index.php?api=claim_reward")
                      .post(formBody)
                      .build()

                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {}
                      override fun onResponse(call: Call, response: Response) {
                          if (response.isSuccessful) {
                              fetchNextVideoAndLaunch()
                          }
                      }
                  })
              }

              private fun fetchNextVideoAndLaunch() {
                  val client = OkHttpClient()
                  val request = Request.Builder()
                      .url("http://zaicash.gamer.gd/index.php?api=get_next_task")
                      .build()

                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {}
                      override fun onResponse(call: Call, response: Response) {
                          val body = response.body?.string() ?: return
                          val vid = body.substringAfter("\"video_id\":\"").substringBefore("\"")
                          val intent = Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:$vid"))
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                      }
                  })
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  super.onDestroy()
                  if (overlayView != null) windowManager?.removeView(overlayView)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-release.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
