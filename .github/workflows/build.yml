name: Build Farmo Earn APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/farmo/earn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Farmo Earn"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.farmo.earn'
              compileSdk 34

              defaultConfig {
                  applicationId "com.farmo.earn"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Farmo Earn</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:notificationTimeout="100"
              android:packageNames="com.google.android.youtube" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/mainWebView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/overlay_countdown.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#DD12072B"
              android:padding="10dp"
              android:orientation="horizontal"
              android:gravity="center">
              <TextView
                  android:id="@+id/overlayTimer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Farmo: 15s"
                  android:textColor="#10b981"
                  android:textSize="14sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".YouTubeWatcherService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/farmo/earn/MainActivity.java
          package com.farmo.earn;

          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.mainWebView);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("http://zaicash.gamer.gd/index.php?app=1");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  checkAllPermissions();
              }

              public void checkAllPermissions() {
                  boolean p1 = isAccessibilityServiceEnabled(this, YouTubeWatcherService.class);
                  boolean p2 = Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this);
                  boolean p3 = Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.System.canWrite(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  boolean p4 = Build.VERSION.SDK_INT < Build.VERSION_CODES.M || (pm != null && pm.isIgnoringBatteryOptimizations(getPackageName()));

                  String t1 = p1 ? "Granted" : "Grant";
                  String t2 = p2 ? "Granted" : "Grant";
                  String t3 = p3 ? "Granted" : "Grant";
                  String t4 = p4 ? "Granted" : "Grant";

                  String js = "javascript:(function(){" +
                          "if(window.grantedPerms){" +
                          "  grantedPerms[1] = " + p1 + "; var b1 = document.getElementById('p-btn-1'); if(b1) b1.innerText = '" + t1 + "';" +
                          "  grantedPerms[2] = " + p2 + "; var b2 = document.getElementById('p-btn-2'); if(b2) b2.innerText = '" + t2 + "';" +
                          "  grantedPerms[3] = " + p3 + "; var b3 = document.getElementById('p-btn-3'); if(b3) b3.innerText = '" + t3 + "';" +
                          "  grantedPerms[4] = " + p4 + "; var b4 = document.getElementById('p-btn-4'); if(b4) b4.innerText = '" + t4 + "';" +
                          "  if(" + p1 + " && " + p2 + " && " + p3 + " && " + p4 + "){" +
                          "    var b = document.getElementById('btn-perm-confirm'); if(b){ b.disabled = false; b.className = 'w-full py-4 rounded-xl purple-gradient text-white font-black text-xs uppercase cursor-pointer'; }" +
                          "  }" +
                          "}" +
                          "})()";
                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              private boolean isAccessibilityServiceEnabled(Context context, Class<?> service) {
                  String expectedComponentName = context.getPackageName() + "/" + service.getName();
                  String enabledServicesSetting = Settings.Secure.getString(
                          context.getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  );
                  return enabledServicesSetting != null && enabledServicesSetting.contains(expectedComponentName);
              }

              public class WebAppInterface {
                  private final Context context;

                  public WebAppInterface(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void requestPerm(int step) {
                      Intent intent;
                      switch (step) {
                          case 1:
                              intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                              startActivity(intent);
                              break;
                          case 2:
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              }
                              break;
                          case 3:
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  intent = new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              }
                              break;
                          case 4:
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName()));
                                  startActivity(intent);
                              }
                              break;
                      }
                  }

                  @JavascriptInterface
                  public void launchYouTube(String videoId) {
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + videoId));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          startActivity(intent);
                          YouTubeWatcherService.startWatchCountdown(context, videoId);
                      } catch (Exception e) {
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/watch?v=" + videoId));
                          webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(webIntent);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/farmo/earn/YouTubeWatcherService.java
          package com.farmo.earn;

          import android.accessibilityservice.AccessibilityService;
          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.os.Build;
          import android.os.CountDownTimer;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.TextView;
          import okhttp3.*;
          import java.io.IOException;

          public class YouTubeWatcherService extends AccessibilityService {

              private WindowManager windowManager;
              private View overlayView;
              private TextView timerText;
              private CountDownTimer countDownTimer;
              public static String activeVideoId = "";

              public static void startWatchCountdown(Context context, String videoId) {
                  activeVideoId = videoId;
              }

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  setupFloatingOverlay();
              }

              @SuppressLint("InflateParams")
              private void setupFloatingOverlay() {
                  int layoutType;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      layoutType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  } else {
                      layoutType = WindowManager.LayoutParams.TYPE_PHONE;
                  }

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          layoutType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                          PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.END;
                  params.x = 30;
                  params.y = 120;

                  overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_countdown, null);
                  timerText = overlayView.findViewById(R.id.overlayTimer);
                  overlayView.setVisibility(View.GONE);

                  try {
                      if (windowManager != null) {
                          windowManager.addView(overlayView, params);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null || event.getPackageName() == null) return;
                  String pkg = event.getPackageName().toString();

                  if ("com.google.android.youtube".equals(pkg)) {
                      if (overlayView != null && overlayView.getVisibility() != View.VISIBLE) {
                          overlayView.setVisibility(View.VISIBLE);
                          run15SecTimer();
                      }
                  } else {
                      if (overlayView != null) {
                          overlayView.setVisibility(View.GONE);
                      }
                      if (countDownTimer != null) {
                          countDownTimer.cancel();
                      }
                  }
              }

              private void run15SecTimer() {
                  if (countDownTimer != null) {
                      countDownTimer.cancel();
                  }
                  countDownTimer = new CountDownTimer(15000, 1000) {
                      @Override
                      public void onTick(long millisUntilFinished) {
                          if (timerText != null) {
                              timerText.setText("Farmo: " + (millisUntilFinished / 1000) + "s");
                          }
                      }

                      @Override
                      public void onFinish() {
                          if (timerText != null) {
                              timerText.setText("Earned!");
                          }
                          claimRewardOnServer();
                      }
                  }.start();
              }

              private void claimRewardOnServer() {
                  OkHttpClient client = new OkHttpClient();
                  RequestBody formBody = new FormBody.Builder()
                          .add("task_id", "0")
                          .build();

                  Request request = new Request.Builder()
                          .url("http://zaicash.gamer.gd/index.php?api=claim_reward")
                          .post(formBody)
                          .build();

                  client.newCall(request).enqueue(new Callback() {
                      @Override
                      public void onFailure(Call call, IOException e) {}

                      @Override
                      public void onResponse(Call call, Response response) {
                          if (response.isSuccessful()) {
                              fetchNextVideoAndLaunch();
                          }
                      }
                  });
              }

              private void fetchNextVideoAndLaunch() {
                  OkHttpClient client = new OkHttpClient();
                  Request request = new Request.Builder()
                          .url("http://zaicash.gamer.gd/index.php?api=get_next_task")
                          .build();

                  client.newCall(request).enqueue(new Callback() {
                      @Override
                      public void onFailure(Call call, IOException e) {}

                      @Override
                      public void onResponse(Call call, Response response) throws IOException {
                          if (response.body() != null) {
                              String body = response.body().string();
                              int start = body.indexOf("\"video_id\":\"");
                              if (start != -1) {
                                  start += 12;
                                  int end = body.indexOf("\"", start);
                                  if (end != -1) {
                                      String vid = body.substring(start, end);
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("vnd.youtube:" + vid));
                                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                      startActivity(intent);
                                  }
                              }
                          }
                      }
                  });
              }

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  super.onDestroy()
                  if (overlayView != null && windowManager != null) {
                      windowManager.removeView(overlayView);
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-release.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
